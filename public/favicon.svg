<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- 4-quadrant research grid with crosshair and connected data nodes -->
  <circle cx="10" cy="10" r="3" fill="#38bdf8"/>
  <circle cx="22" cy="10" r="3" fill="#0ea5e9"/>
  <circle cx="10" cy="22" r="3" fill="#0284c7"/>
  <circle cx="22" cy="22" r="3" fill="#2563eb"/>
  <!-- Connecting clinical lattice lines -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="10" y1="22" x2="22" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="10" y1="10" x2="10" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="22" y1="10" x2="22" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Center validation pivot -->
  <circle cx="16" cy="16" r="3" fill="#10b981"/>
  <circle cx="16" cy="16" r="1.2" fill="#ffffff"/>
</svg>